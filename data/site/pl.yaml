# Polska treść strony głównej. Pozycje z `placeholder: true` mają plakietkę,
# dopóki `showPlaceholderBadges` w params.toml jest włączone.
# Rejestr: pełne zdania, bez kontrastów „nie X, tylko Y”, bez trójek i puent (Anti-LLM-Writing-Rules w vaulcie).

hero:
  eyebrow: "Ruch na rzecz otwartych interfejsów w ochronie zdrowia"
  title: "Dane medyczne muszą móc się przemieszczać."
  lead: >-
    Każdy system, który kupuje szpital, powinien móc wymieniać dane z każdym innym przez otwarte
    standardy i na opublikowanych warunkach. OpenMedGate zbiera dowody i formułuje postulaty,
    które wprowadzają tę zasadę do umów i postępowań.
  cta_primary: "Postulaty"
  cta_secondary: "Mechanizm"
  scroll: "Przewiń"

marquee: ["HL7 FHIR", "DICOM", "profile IHE", "HL7 v2", "openEHR", "SNOMED CT", "LOINC", "EHDS", "IHE XDS", "OAuth 2.0"]

why:
  label: "Punkt wyjścia"
  title: "Stan rzeczy"
  items:
    - figure: data
      kicker: "01 · Dane"
      labels: { patient: "Pacjent", facility: "Placówka", record: "Dane pacjenta", supplier: "Dostawca systemu" }
      title: "Dane o pacjencie należą do pacjenta i do placówki, która go leczy."
      text: "Dostawca systemu, w którym te dane są przechowywane, przetwarza je na zlecenie placówki."
    - figure: standards
      kicker: "02 · Standardy"
      title: "Standardy wymiany danych medycznych są dojrzałe i powszechnie dostępne."
      text: "HL7, DICOM, profile IHE i FHIR od lat opisują, jak dane mają przepływać między systemami."
    - figure: access
      kicker: "03 · Dostęp"
      labels: { system: "System szpitalny", integrator: "Integrator" }
      title: "Dostęp do interfejsów konkretnej instalacji rzadko jest opisany publicznie."
      text: "Zakres udostępnianych danych i warunki połączenia zwykle zna wyłącznie producent systemu, a placówka i jej wykonawcy muszą o nie występować."

mechanism:
  label: "Mechanizm"
  title: "Jak to działa dziś i jak mogłoby działać"
  toggle_closed: "Dziś"
  toggle_open: "Otwarte interfejsy"
  nodes:
    core: "System szpitalny"
    lab: "Laboratorium"
    imaging: "Obrazowanie"
    ai: "Modele AI"
    registration: "E-rejestracja"
    pharmacy: "Apteka"
    national: "Krajowe e-zdrowie"
  closed:
    title: "Opis interfejsów pozostaje w rękach producenta systemu centralnego."
    text: "Każda integracja wymaga jego udziału i jego wyceny. Zamawiający dopuszcza oferty równoważne, lecz poza producentem nikt nie jest w stanie takiej oferty przygotować."
    badge: "Jeden dostawca"
  open:
    title: "Opis interfejsów jest częścią dokumentacji systemu, a warunki dostępu są opublikowane."
    text: "Każdy integrator może połączyć się przez standardowe interfejsy, korzystając ze środowiska testowego i znając koszt z góry. O wyborze wykonawcy decyduje placówka."
    badge: "Dowolny integrator"

postulates:
  label: "Postulaty"
  title: "Sześć postulatów"
  intro: "Zasady, które powinny znaleźć się w każdej umowie na system szpitalny i w każdym postępowaniu na jego zakup."
  items:
    - title: "Dane pacjenta należą do pacjenta i do placówki, która je gromadzi."
      text: "Dostawca oprogramowania, w którym są zapisane, nie nabywa do nich żadnych praw."
    - title: "Placówka ma prawo do opisu interfejsów każdego systemu, który kupuje, i może przekazać go wybranemu przez siebie wykonawcy."
      text: "Korzystanie z tego prawa nie wymaga zgody producenta."
    - title: "Tam, gdzie istnieje otwarty standard, interfejs jest z nim zgodny."
      text: "Formaty własne producenta są dopuszczalne wyłącznie w zakresie, którego HL7 FHIR, DICOM ani profile IHE nie obejmują."
    - title: "Warunki dostępu do interfejsów są opublikowane i znane w dniu podpisania umowy."
      text: "Cenę i zasady dostępu ustala się przy zakupie systemu, zanim pojawi się pierwsza integracja."
    - title: "Każdy integrator otrzymuje środowisko testowe i dane testowe."
      text: "Publiczne platformy e-zdrowia udostępniają je każdemu dostawcy na wniosek i ten sam standard powinien obowiązywać systemy szpitalne."
    - title: "Zamawiający podaje w dokumentach postępowania, czy specyfikacja interfejsów posiadanego systemu jest dostępna i na jakich warunkach."
      text: "Wykonawca może wtedy wycenić integrację przed złożeniem oferty, a dopuszczenie oferty równoważnej nabiera treści."
  outro: "Podpis pod postulatami oznacza poparcie dla tych sześciu zasad i do niczego więcej nie zobowiązuje. Sygnatariusz nie bierze udziału w sporach prowadzonych przez założycieli ani nie odpowiada za ich wypowiedzi."
  cta: "Podpisz postulaty"

founders:
  label: "Założyciele"
  title: "Kim jesteśmy"
  intro: "OpenMedGate założyli w 2026 roku Sylwester Cyrwus i Krzysztof Bokiej. Obaj od lat budują i wdrażają systemy informatyczne dla ochrony zdrowia i sami zadawali pytania w postępowaniach, o których tu piszą."
  people:
    - id: sylwester-cyrwus
      name: "Sylwester Cyrwus"
      role: "Współzałożyciel"
      line: "Analizuje postępowania przetargowe i pisze o tym, co wynika z ich dokumentów."
      bio: "Od ponad dziesięciu lat prowadzi projekty informatyczne dla firm farmaceutycznych i szpitali. Kieruje jednostką Healthcare & Life Sciences w firmie wdrożeniowej."
    - id: krzysztof-bokiej
      name: "Krzysztof Bokiej"
      role: "Współzałożyciel"
      line: "Odpowiada za standardy wymiany danych i architekturę interfejsów."
      bio: "Od siedemnastu lat projektuje i buduje integracje systemów w dużych organizacjach, w tym w branży farmaceutycznej i w diagnostyce laboratoryjnej."

