# Polska treść strony głównej. Krótko. Pozycje z `placeholder: true` mają plakietkę,
# dopóki `showPlaceholderBadges` w params.toml jest włączone.

hero:
  eyebrow: "Ruch na rzecz otwartych interfejsów w ochronie zdrowia"
  title: "Dane medyczne muszą móc się przemieszczać."
  lead: >-
    Każdy system, który kupuje szpital, powinien móc rozmawiać z każdym innym: przez otwarte
    standardy, na opublikowanych warunkach. OpenMedGate to ruch i rejestr dowodów na rzecz tej
    jednej idei.
  cta_primary: "Postulaty"
  cta_secondary: "Zobacz mechanizm"
  scroll: "Przewiń"
  not: ["Nie firma", "Nie produkt", "Bez kodu do otwarcia", "Nic na sprzedaż"]

marquee: ["HL7 FHIR", "DICOM", "profile IHE", "HL7 v2", "openEHR", "SNOMED CT", "LOINC", "EHDS", "IHE XDS", "OAuth 2.0"]

why:
  label: "Dlaczego"
  title: "Trzy fakty, na których stoi ruch"
  items:
    - icon: people
      title: "Dane należą do pacjentów i do placówek, które się nimi opiekują."
      text: "Nie do dostawcy oprogramowania, w którym akurat są zapisane."
    - icon: layers
      title: "Standardy istnieją i są dojrzałe."
      text: "HL7, FHIR, DICOM i IHE opisują, jak dane medyczne przemieszczają się między systemami, i robią to od dekad."
    - icon: key
      title: "Brakuje dostępu."
      text: "Co wystawia konkretna instalacja i na jakich warunkach, zwykle nie jest publiczne. Tam kończy się interoperacyjność."

mechanism:
  label: "Mechanizm"
  title: "Dziś zamknięte. Otwarte z założenia."
  toggle_closed: "Dziś"
  toggle_open: "Otwarte interfejsy"
  nodes:
    core: "System szpitalny"
    lab: "Laboratorium"
    imaging: "Obrazowanie"
    ai: "Modele AI"
    registration: "E-rejestracja"
    pharmacy: "Apteka"
    national: "Krajowe e-zdrowie"
  closed:
    title: "Opis interfejsu ma jedna strona."
    text: "Każda integracja przechodzi przez producenta systemu centralnego. Oferty równoważne są dopuszczone na papierze; nikt inny nie potrafi ich wycenić."
    badge: "1 dostawca"
  open:
    title: "Interfejs jest opisany, warunki opublikowane."
    text: "Każdy integrator łączy się przez standardowe interfejsy, ze środowiskiem testowym i znanym kosztem. Wybiera placówka."
    badge: "Dowolny integrator"

postulates:
  label: "Postulaty"
  title: "O co nam chodzi"
  intro: "Sześć zdań. Firma przeczyta je w minutę i podpisze bez prawnika."
  items:
    - title: "Dane pacjenta należą do pacjenta i do placówki, która je gromadzi."
      text: "Nigdy do dostawcy oprogramowania, w którym są zapisane."
    - title: "Placówka ma prawo do opisu interfejsów każdego systemu, który kupuje, i może przekazać go, komu chce."
      text: "To prawo nie może zależeć od zgody producenta na konkurencję."
    - title: "Tam, gdzie istnieje otwarty standard, on jest interfejsem."
      text: "Najpierw HL7 FHIR, DICOM i profile IHE. Formaty własne tylko tam, gdzie standard nie sięga."
    - title: "Warunki dostępu są opublikowane i znane w dniu podpisania umowy."
      text: "Nie negocjowane przy pierwszej integracji i nie wyceniane przez stronę, która konkuruje z integratorem."
    - title: "Każdy integrator dostaje środowisko testowe i dane testowe."
      text: "Publiczne platformy e-zdrowia robią to już dziś dla każdego dostawcy na wniosek. System szpitalny też może."
    - title: "Otwartość jest mierzona i publikowana."
      text: "Liczba ofert, dostępność specyfikacji, koszt dostępu: liczone z dokumentów publicznych, z jawną metodą i mianownikiem."
  outro: "Sygnatariusze podpisują postulaty, nie posty. Podpis znaczy: chcemy tych samych reguł. Nie zobowiązuje nikogo do udziału w żadnym sporze."
  cta: "Podpisz postulaty"

evidence:
  label: "Dowody"
  title: "Objawy, policzone"
  intro: >-
    Postępowanie z jedną ofertą to objaw, nie wyrok. Objawy liczymy z dokumentów publicznych,
    z jawną metodą, i publikujemy z mianownikiem.
  matrix:
    label: "postępowań w bieżącym przeglądzie"
    status: "Liczby w audycie. Metoda jest publiczna; liczby będą."
    placeholder: true
  stats:
    - value: "—"
      unit: "%"
      label: "części rozstrzygniętych przy jednej ofercie"
      placeholder: true
    - value: "—"
      unit: ""
      label: "przejrzanych części, każda z dwoma niezależnymi odczytami"
      placeholder: true
    - value: "—"
      unit: ""
      label: "zamawiających, którzy po pytaniach zmienili dokumenty"
      placeholder: true
  columns:
    ref: "Sygn."
    date: "Data"
    finding: "Ustalenie"
    source: "Źródło"
  rows:
    - ref: "OMG-2026-001"
      date: "2026-09-22"
      finding: >-
        Zapytany o dokumentację interfejsów swojego systemu szpitalnego zamawiający odpowiedział,
        że jej nie posiada: „dokumentacja ta stanowi dokumentację własnościową producenta”. Jedna oferta.
      source: "Postępowanie ZP-1559-2026 · wyjaśnienia z 22.09.2026"
      placeholder: true
    - ref: "OMG-2026-002"
      date: "[data]"
      finding: "Udział części rozstrzygniętych przy jednej ofercie, według segmentu i roku."
      source: "[populacja · okres · źródło · metoda]"
      placeholder: true
    - ref: "OMG-2026-003"
      date: "[data]"
      finding: "Co publiczny operator e-zdrowia udostępnia integratorom, a czego nie udostępniają producenci systemów szpitalnych."
      source: "[wykaz dokumentów]"
      placeholder: true
  method:
    title: "Jak liczymy"
    items:
      - "Jednostką jest część zamówienia, nie całe postępowanie."
      - "Dwadzieścia cztery miesiące ogłoszeń o wyniku: BZP poniżej progów unijnych, TED powyżej."
      - "Budżet wyłącznie z oficjalnego dokumentu; inaczej „brak informacji”, nigdy szacunek."
      - "Każdy dokument ze skrótem kryptograficznym w chwili pobrania i czytany dwa razy, za drugim razem niezależnie."
      - "Rozbieżności ujawniane, nie uśredniane."

