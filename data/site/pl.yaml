history:
  label: "Nota"
  title: "Co się zmieniło"
  date: "Listopad 2026"
  text: >-
    Do jesieni 2026 ta strona opisywała OpenMedGate jako platformę integracyjną, odliczała dni do
    otwarcia kodu i przedstawiała QuantumMed jako swój produkt. Wycofujemy to wprost: nie ma kodu
    do otwarcia i nie ma produktu. Jest ruch, jego postulaty i jego dowody. Dawne strony zostały
    w archiwach internetu; wolimy powiedzieć to sami.

contact:
  title: "Kontakt"
  text: "Ustalenie, sprostowanie, podpis albo własny, udokumentowany przypadek."
