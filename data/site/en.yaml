# English copy of the start page. Keep it short. Items with `placeholder: true` carry a badge
# while `showPlaceholderBadges` is on in params.toml.

hero:
  eyebrow: "A movement for open interfaces in healthcare"
  title: "Health data must be able to move."
  lead: >-
    Every system a hospital buys should be able to talk to any other: through open standards,
    on published terms. OpenMedGate is a movement and a registry of evidence for that one idea.
  cta_primary: "The postulates"
  cta_secondary: "See the mechanism"
  scroll: "Scroll"
  not: ["Not a company", "Not a product", "No code to release", "Nothing for sale"]

marquee: ["HL7 FHIR", "DICOM", "IHE profiles", "HL7 v2", "openEHR", "SNOMED CT", "LOINC", "EHDS", "IHE XDS", "OAuth 2.0"]

why:
  label: "Why"
  title: "Three facts the movement stands on"
  items:
    - icon: people
      title: "The data belong to patients and to the facilities that care for them."
      text: "Not to the supplier of the software they happen to be stored in."
    - icon: layers
      title: "The standards exist and are mature."
      text: "HL7, FHIR, DICOM and IHE describe how health data travel between systems, and have for decades."
    - icon: key
      title: "Access is the missing piece."
      text: "What a specific installation exposes, and on what terms, is usually not public. That is where interoperability ends."

mechanism:
  label: "The mechanism"
  title: "Closed today. Open by design."
  toggle_closed: "Today"
  toggle_open: "Open interfaces"
  nodes:
    core: "Hospital system"
    lab: "Laboratory"
    imaging: "Imaging"
    ai: "AI models"
    registration: "E-registration"
    pharmacy: "Pharmacy"
    national: "National e-health"
  closed:
    title: "One party holds the interface description."
    text: "Every integration goes through the producer of the core system. Equivalent offers are admitted on paper; nobody else can price one."
    badge: "1 supplier"
  open:
    title: "The interface is described, the terms are published."
    text: "Any integrator can connect through standard interfaces, with a test environment and known costs. The facility chooses."
    badge: "Any integrator"

postulates:
  label: "Postulates"
  title: "What we stand for"
  intro: "Six sentences. A company can read them in a minute and sign them without a lawyer."
  items:
    - title: "Patient data belong to the patient and to the facility that collects them."
      text: "Never to the supplier of the software they are stored in."
    - title: "A facility has the right to the interface description of every system it buys, and may hand it to whomever it chooses."
      text: "That right cannot depend on a producer's consent to competition."
    - title: "Where an open standard exists, it is the interface."
      text: "HL7 FHIR, DICOM and IHE profiles first. Proprietary formats only where no standard reaches."
    - title: "Terms of access are published and known on the day the contract is signed."
      text: "Not negotiated at the first integration, and not priced by the party that competes with the integrator."
    - title: "Every integrator gets a test environment and test data."
      text: "Public e-health platforms already do this for any supplier on request. A hospital system can too."
    - title: "Openness is measured and published."
      text: "Number of bids, availability of specifications, cost of access: counted from public documents, with a stated method and a denominator."
  outro: "Signatories sign the postulates, not the posts. A signature means: we want the same rules. It obliges nobody to take part in any dispute."
  cta: "Sign the postulates"

evidence:
  label: "Evidence"
  title: "Symptoms, counted"
  intro: >-
    A procedure with one bid is a symptom, not a verdict. We count symptoms from public documents,
    with a stated method, and publish them with their denominators.
  matrix:
    label: "procedures in the current review"
    status: "Numbers under audit. The method is public; the numbers follow."
    placeholder: true
  stats:
    - value: "—"
      unit: "%"
      label: "lots decided with a single bid"
      placeholder: true
    - value: "—"
      unit: ""
      label: "lots reviewed, two independent readings each"
      placeholder: true
    - value: "—"
      unit: ""
      label: "buyers who changed documents after questions"
      placeholder: true
  columns:
    ref: "Ref."
    date: "Date"
    finding: "Finding"
    source: "Source"
  rows:
    - ref: "OMG-2026-001"
      date: "2026-09-22"
      finding: >-
        Asked for the interface documentation of its hospital system, a buyer answered that it does
        not hold it: “this documentation is the proprietary documentation of the producer”. One bid.
      source: "Procedure ZP-1559-2026 · clarification of 22 Sept 2026"
      placeholder: true
    - ref: "OMG-2026-002"
      date: "[date]"
      finding: "Share of lots decided with a single bid, by segment and year."
      source: "[population · period · source · method]"
      placeholder: true
    - ref: "OMG-2026-003"
      date: "[date]"
      finding: "What a public e-health operator publishes to integrators, and what producers of hospital systems do not."
      source: "[list of documents]"
      placeholder: true
  method:
    title: "How we count"
    items:
      - "The unit is a lot of a contract, not the whole procedure."
      - "Twenty-four months of result notices: the national bulletin below the EU thresholds, TED above."
      - "A budget only from the official document; otherwise “no information”, never an estimate."
      - "Every document hashed when captured and read twice, the second time independently."
      - "Discrepancies disclosed, not averaged away."

