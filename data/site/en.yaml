# English copy of the start page. Items with `placeholder: true` carry a badge
# while `showPlaceholderBadges` is on in params.toml.
# Register: full sentences, no "not X but Y" contrasts, no triads, no closing aphorisms.

hero:
  eyebrow: "A movement for open interfaces in healthcare"
  title: "Health data must be able to move."
  lead: >-
    Every system a hospital buys should be able to exchange data with any other, through open
    standards and on published terms. OpenMedGate collects the evidence for that principle and
    sets out postulates that bring it into contracts and procurement.
  cta_primary: "The postulates"
  cta_secondary: "The mechanism"
  scroll: "Scroll"

marquee: ["HL7 FHIR", "DICOM", "IHE profiles", "HL7 v2", "openEHR", "SNOMED CT", "LOINC", "EHDS", "IHE XDS", "OAuth 2.0"]

why:
  label: "Starting point"
  title: "Where things stand"
  items:
    - figure: data
      kicker: "01 · Data"
      labels: { patient: "Patient", facility: "Facility", record: "Patient data", supplier: "System supplier" }
      title: "Patient data belong to the patient and to the facility that treats them."
      text: "The supplier of the system that stores them processes them on the facility's behalf."
    - figure: standards
      kicker: "02 · Standards"
      title: "The standards for exchanging health data are mature and widely available."
      text: "HL7, DICOM, the IHE profiles and FHIR have described for years how data should flow between systems."
    - figure: access
      kicker: "03 · Access"
      labels: { system: "Hospital system", integrator: "Integrator" }
      title: "Access to the interfaces of a specific installation is rarely described publicly."
      text: "The scope of the data exposed and the conditions of connecting are usually known to the producer alone, and the facility and its contractors have to ask for them."

mechanism:
  label: "The mechanism"
  title: "How it works today, and how it could work"
  toggle_closed: "Today"
  toggle_open: "Open interfaces"
  nodes:
    core: "Hospital system"
    lab: "Laboratory"
    imaging: "Imaging"
    ai: "AI models"
    registration: "E-registration"
    pharmacy: "Pharmacy"
    national: "National e-health"
  closed:
    title: "The interface description stays with the producer of the core system."
    text: "Every integration requires its participation and its pricing. The buyer admits equivalent offers, yet nobody except the producer is able to prepare one."
    badge: "One supplier"
  open:
    title: "The interface description is part of the system's documentation and the terms of access are published."
    text: "Any integrator can connect through standard interfaces, with a test environment and a cost known in advance. The facility chooses the contractor."
    badge: "Any integrator"

postulates:
  label: "Postulates"
  title: "Six postulates"
  intro: "Principles that belong in every contract for a hospital system and in every procedure to buy one."
  items:
    - title: "Patient data belong to the patient and to the facility that collects them."
      text: "The supplier of the software in which they are stored acquires no rights to them."
    - title: "A facility has the right to the interface description of every system it buys and may hand it to a contractor of its choice."
      text: "Exercising that right requires no consent from the producer."
    - title: "Where an open standard exists, the interface conforms to it."
      text: "A producer's own formats are admissible only in the scope that HL7 FHIR, DICOM and the IHE profiles do not cover."
    - title: "The terms of access to the interfaces are published and known on the day the contract is signed."
      text: "The price and the rules of access are settled when the system is bought, before the first integration appears."
    - title: "Every integrator receives a test environment and test data."
      text: "Public e-health platforms provide them to any supplier on request, and the same standard should apply to hospital systems."
    - title: "A buyer states in the procurement documents whether the interface specification of the system it already runs is available, and on what terms."
      text: "A bidder can then price the integration before submitting an offer, and the admission of equivalent offers gains substance."
  outro: "A signature under the postulates expresses support for these six principles and creates no further obligation. A signatory takes no part in disputes conducted by the founders and bears no responsibility for their statements."
  cta: "Sign the postulates"

founders:
  label: "Founders"
  title: "Who we are"
  intro: "OpenMedGate was founded in 2026 by Sylwester Cyrwus and Krzysztof Bokiej. Both have built and deployed information systems for healthcare for years, and they have themselves asked questions in the procedures they write about here."
  people:
    - id: sylwester-cyrwus
      name: "Sylwester Cyrwus"
      role: "Co-founder"
      line: "Analyses procurement procedures and writes about what their documents show."
      bio: "Co-founder and CEO of QuantumMed. For more than ten years he has led IT projects for pharmaceutical companies and healthcare providers, currently also as director of a Healthcare & Life Sciences business unit at a consulting and delivery firm."
    - id: krzysztof-bokiej
      name: "Krzysztof Bokiej"
      role: "Co-founder"
      line: "Responsible for data exchange standards and interface architecture."
      bio: "Co-founder and CTO of QuantumMed. For seventeen years he has designed and built system integrations in large organisations, earlier at Roche and MNM Diagnostics, among others."

