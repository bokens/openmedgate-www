history:
  label: "Note"
  title: "What changed"
  date: "November 2026"
  text: >-
    Until autumn 2026 this site described OpenMedGate as an integration platform, counted down to a
    release of its source code and presented QuantumMed as its product. We withdraw that in plain
    words: there is no code to release and no product. There is a movement, its postulates and its
    evidence. The earlier pages remain in web archives; we would rather say this ourselves.

