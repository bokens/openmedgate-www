{{- $k := . -}}
{{- if eq $k "people" -}}
<svg class="why-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="18" cy="16" r="7"/><path d="M4 40c0-8 6-13 14-13s14 5 14 13"/><circle cx="34" cy="18" r="5"/><path d="M34 27c6 0 10 4 10 10"/></svg>
{{- else if eq $k "layers" -}}
<svg class="why-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 4 16l20 10 20-10z"/><path d="M4 26l20 10 20-10"/><path d="M4 36l20 10 20-10"/></svg>
{{- else if eq $k "key" -}}
<svg class="why-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="16" cy="24" r="10"/><path d="M26 24h18M38 24v8M32 24v6"/></svg>
{{- else if eq $k "arrow" -}}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
{{- else if eq $k "down" -}}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 12l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
{{- end -}}
